{% extends "base.html" %}

{% block content %}
<section class="admin-shell">
    <div class="admin-panel admin-login-panel">
        <div>
            <p class="admin-kicker">Admin</p>
            <h1>Sign in</h1>
        </div>
        {% if error %}
        <p class="admin-error">{{ error }}</p>
        {% endif %}
        <form method="post" action="/admin/login" class="admin-form">
            <label>
                <span>Password</span>
                <input type="password" name="password" required autofocus>
            </label>
            <button type="submit" class="admin-primary-button">Open dashboard</button>
        </form>
    </div>
</section>
{% endblock %}
