        function getLanguage() {
            return localStorage.getItem(LANGUAGE_KEY) || 'kn';
        }

        function t(key, params = {}) {
            const language = getLanguage();
            const dictionary = I18N[language] || I18N.kn;
            const fallback = I18N.en[key] || key;
            return (dictionary[key] || fallback).replace(/\{(\w+)\}/g, (_, name) => params[name] ?? '');
        }

        function nameForLanguage(item) {
            const language = getLanguage();
            const nameEn = item.name_en || item.nameEn;
            const nameKn = item.name_kn || item.nameKn;

            return language === 'en'
                ? (nameEn || nameKn || '')
                : (nameKn || nameEn || '');
        }

        function relationshipForLanguage(item) {
            const language = getLanguage();
            const relationshipEn = item.relationship_en || item.relationshipEn;
            const relationshipKn = item.relationship_kn || item.relationshipKn;

            return language === 'en'
                ? (relationshipEn || relationshipKn || '')
                : (relationshipKn || relationshipEn || '');
        }

        function genderForLanguage(gender) {
            if (gender === 'MALE' || gender === 'Male') return t('male');
            if (gender === 'FEMALE' || gender === 'Female') return t('female');
            return t('unknown_gender');
        }

        function createProfileIcon(className = '') {
            const icon = document.createElement('span');
            icon.className = `loader-profile-icon ${className}`.trim();
            icon.setAttribute('aria-hidden', 'true');
            icon.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21a8 8 0 0 1 16 0"></path>
                </svg>
            `;
            return icon;
        }

        function createLoadingPanel(type, label) {
            const panel = document.createElement('div');
            panel.className = `loading-panel ${type === 'relationship' ? 'relationship-loading' : 'profile-loading'}`;
            panel.setAttribute('role', 'status');
            panel.setAttribute('aria-live', 'polite');

            const animation = document.createElement('div');
            animation.className = 'loader-animation';

            if (type === 'relationship') {
                animation.append(
                    createProfileIcon('loader-profile-left'),
                    createProfileIcon('loader-profile-right')
                );
            } else {
                animation.appendChild(createProfileIcon('loader-profile-single'));
            }

            const text = document.createElement('span');
            text.className = 'loading-text';
            text.textContent = label;

            panel.append(animation, text);
            return panel;
        }

        function normalizeSearchText(value) {
            return String(value || '').toLocaleLowerCase().trim();
        }

        function optionSearchText(option) {
            return [option.textContent, option.dataset.nameEn, option.dataset.nameKn]
                .filter(Boolean)
                .join(' ');
        }

        function enhancePersonSelect(select) {
            if (!select || select.dataset.searchableReady === 'true') return;

            select.dataset.searchableReady = 'true';
            select.classList.add('native-searchable-select');

            const wrapper = document.createElement('div');
            wrapper.className = 'searchable-select';

            const input = document.createElement('input');
            input.type = 'search';
            input.className = 'searchable-select-input';
            input.autocomplete = 'off';
            input.placeholder = t('search_person');
            input.setAttribute('aria-label', t('search_person'));
            input.setAttribute('aria-expanded', 'false');

            const list = document.createElement('div');
            list.className = 'searchable-select-list';
            list.setAttribute('role', 'listbox');

            select.parentNode.insertBefore(wrapper, select);
            wrapper.append(select, input, list);

            function options() {
                return Array.from(select.options).filter((option) => option.value);
            }

            function selectedOption() {
                return select.selectedOptions[0]?.value ? select.selectedOptions[0] : null;
            }

            function setOpen(isOpen) {
                wrapper.classList.toggle('is-open', isOpen);
                input.setAttribute('aria-expanded', String(isOpen));
            }

            function choose(option) {
                select.value = option.value;
                input.value = nameForLanguage(option.dataset);
                setOpen(false);
                select.dispatchEvent(new Event('change', { bubbles: true }));
            }

            function renderList(query = input.value) {
                const search = normalizeSearchText(query);
                const matches = options()
                    .filter((option) => !search || normalizeSearchText(optionSearchText(option)).includes(search))
                    .sort((a, b) => {
                        const aText = normalizeSearchText(optionSearchText(a));
                        const bText = normalizeSearchText(optionSearchText(b));
                        const aStarts = aText.startsWith(search) ? 0 : 1;
                        const bStarts = bText.startsWith(search) ? 0 : 1;
                        return aStarts - bStarts || nameForLanguage(a.dataset).localeCompare(nameForLanguage(b.dataset));
                    });

                list.innerHTML = '';

                if (!matches.length) {
                    const empty = document.createElement('div');
                    empty.className = 'searchable-select-empty';
                    empty.textContent = t('no_people_found');
                    list.appendChild(empty);
                    return;
                }

                matches.forEach((option) => {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'searchable-select-option';
                    item.setAttribute('role', 'option');
                    item.textContent = nameForLanguage(option.dataset);
                    item.addEventListener('mousedown', (event) => event.preventDefault());
                    item.addEventListener('click', () => choose(option));
                    list.appendChild(item);
                });
            }

            input.addEventListener('focus', () => {
                renderList();
                setOpen(true);
            });

            input.addEventListener('input', () => {
                select.value = '';
                renderList();
                setOpen(true);
            });

            input.addEventListener('keydown', (event) => {
                const firstOption = list.querySelector('.searchable-select-option');
                if (event.key === 'Enter' && firstOption) {
                    event.preventDefault();
                    firstOption.click();
                }
                if (event.key === 'Escape') {
                    setOpen(false);
                }
            });

            input.addEventListener('blur', () => {
                window.setTimeout(() => {
                    const option = selectedOption();
                    input.value = option ? nameForLanguage(option.dataset) : '';
                    setOpen(false);
                }, 120);
            });

            select.addEventListener('change', () => {
                const option = selectedOption();
                input.value = option ? nameForLanguage(option.dataset) : '';
            });

            window.addEventListener('languagechange', () => {
                input.placeholder = t('search_person');
                input.setAttribute('aria-label', t('search_person'));
                const option = selectedOption();
                input.value = option ? nameForLanguage(option.dataset) : input.value;
                if (wrapper.classList.contains('is-open')) renderList();
            });
        }

        function setSearchableSelectDisabled(select, isDisabled) {
            const wrapper = select?.closest('.searchable-select');
            const input = wrapper?.querySelector('.searchable-select-input');
            if (input) input.disabled = isDisabled;
        }

        function applyLanguage() {
            const language = getLanguage();
            document.documentElement.lang = language === 'en' ? 'en' : 'kn';
            document.title = t('site_title');

            document.querySelectorAll('[data-name-en], [data-name-kn]').forEach((element) => {
                element.textContent = nameForLanguage(element.dataset);
            });

            document.querySelectorAll('[data-i18n]').forEach((element) => {
                element.textContent = t(element.dataset.i18n, element.dataset);
            });

            document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
                element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel));
            });

            const toggle = document.getElementById('language-toggle');
            if (toggle) {
                toggle.textContent = t('toggle_label');
                toggle.setAttribute('aria-label', t('toggle_aria'));
            }

            const menuToggle = document.getElementById('menu-toggle');
            if (menuToggle) {
                const isOpen = document.body.classList.contains('nav-open');
                menuToggle.setAttribute('aria-label', t(isOpen ? 'close_menu' : 'open_menu'));
            }

            window.dispatchEvent(new CustomEvent('languagechange', { detail: { language } }));
        }

        function setMenuOpen(isOpen) {
            document.body.classList.toggle('nav-open', isOpen);

            const menuToggle = document.getElementById('menu-toggle');
            const drawer = document.getElementById('site-menu');
            if (menuToggle) {
                menuToggle.setAttribute('aria-expanded', String(isOpen));
                menuToggle.setAttribute('aria-label', t(isOpen ? 'close_menu' : 'open_menu'));
            }
            if (drawer) {
                drawer.setAttribute('aria-hidden', String(!isOpen));
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('language-toggle')?.addEventListener('click', () => {
                localStorage.setItem(LANGUAGE_KEY, getLanguage() === 'en' ? 'kn' : 'en');
                applyLanguage();
            });

            document.getElementById('menu-toggle')?.addEventListener('click', () => {
                setMenuOpen(!document.body.classList.contains('nav-open'));
            });

            document.getElementById('menu-backdrop')?.addEventListener('click', () => {
                setMenuOpen(false);
            });

            document.querySelectorAll('#site-menu a').forEach((link) => {
                link.addEventListener('click', () => setMenuOpen(false));
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    setMenuOpen(false);
                }
            });

            window.addEventListener('resize', () => {
                if (window.matchMedia('(min-width: 721px)').matches) {
                    setMenuOpen(false);
                }
            });

            document.querySelectorAll('.js-person-search-select').forEach(enhancePersonSelect);
            applyLanguage();
        });
    </script>
