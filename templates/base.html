        function getLanguage() {
            return localStorage.getItem(LANGUAGE_KEY) || 'kn';
        }

        function t(key, params = {}) {
            const language = getLanguage();
            const dictionary = I18N[language] || I18N.kn;
            const fallback = I18N.en[key] || key;
            return (dictionary[key] || fallback).replace(/\{(\w+)\}/g, (_, name) => params[name] ?? '');
        }

        function nameForLanguage(item) {
            const language = getLanguage();
            const nameEn = item.name_en || item.nameEn;
            const nameKn = item.name_kn || item.nameKn;

            return language === 'en'
                ? (nameEn || nameKn || '')
                : (nameKn || nameEn || '');
        }

        function relationshipForLanguage(item) {
            const language = getLanguage();
            const relationshipEn = item.relationship_en || item.relationshipEn;
            const relationshipKn = item.relationship_kn || item.relationshipKn;

            return language === 'en'
                ? (relationshipEn || relationshipKn || '')
                : (relationshipKn || relationshipEn || '');
        }

        function genderForLanguage(gender) {
            if (gender === 'Male') return t('male');
            if (gender === 'Female') return t('female');
            return t('unknown_gender');
        }

        function applyLanguage() {
            const language = getLanguage();
            document.documentElement.lang = language === 'en' ? 'en' : 'kn';
            document.title = t('site_title');

            document.querySelectorAll('[data-name-en], [data-name-kn]').forEach((element) => {
                element.textContent = nameForLanguage(element.dataset);
            });

            document.querySelectorAll('[data-i18n]').forEach((element) => {
                element.textContent = t(element.dataset.i18n, element.dataset);
            });

            document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
                element.setAttribute('aria-label', t(element.dataset.i18nAriaLabel));
            });

            const toggle = document.getElementById('language-toggle');
            if (toggle) {
                toggle.textContent = t('toggle_label');
                toggle.setAttribute('aria-label', t('toggle_aria'));
            }

            window.dispatchEvent(new CustomEvent('languagechange', { detail: { language } }));
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('language-toggle')?.addEventListener('click', () => {
                localStorage.setItem(LANGUAGE_KEY, getLanguage() === 'en' ? 'kn' : 'en');
                applyLanguage();
            });

            applyLanguage();
        });
