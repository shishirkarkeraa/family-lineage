{% extends "base.html" %}

{% block content %}
<div class="card search-card">
    <h2 data-i18n="nav_profile">ನಿಮ್ಮ ಪ್ರೊಫೈಲ್ ಪಡೆಯಿರಿ</h2>
    <p class="mb-4 text-secondary" data-i18n="profile_intro">ಅವರ ಪ್ರೊಫೈಲ್ ನೋಡಲು ವ್ಯಕ್ತಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ.</p>
    
    <div class="flex gap-4 items-center">
        <select id="person-select" class="js-person-search-select">
            <option value="" data-i18n="select_person">-- ವ್ಯಕ್ತಿಯನ್ನು ಆಯ್ಕೆಮಾಡಿ --</option>
            {% for p in persons %}
                <option value="{{ p.id }}" data-name-en="{{ p.name_en }}" data-name-kn="{{ p.name_kn }}">{{ p.name_kn }}</option>
            {% endfor %}
        </select>
        <button id="profile-submit" onclick="fetchLineage()" data-i18n="get_profile">ಪ್ರೊಫೈಲ್ ಪಡೆಯಿರಿ</button>
    </div>
    
    <div id="result" class="lineage-container"></div>

    <div class="profile-edit-backdrop" id="profile-edit-modal" aria-hidden="true">
        <div class="profile-edit-modal" role="dialog" aria-modal="true" aria-labelledby="profile-edit-title">
            <div class="profile-edit-header">
                <div>
                    <p class="admin-kicker" data-i18n="pending_review">ಪರಿಶೀಲನೆ ಬಾಕಿ</p>
                    <h3 id="profile-edit-title" data-i18n="edit_person">ವ್ಯಕ್ತಿಯನ್ನು ತಿದ್ದುಪಡಿ ಮಾಡಿ</h3>
                </div>
                <button type="button" class="admin-icon-button" id="profile-edit-close" data-i18n-aria-label="close_menu" aria-label="ಮೆನು ಮುಚ್ಚಿರಿ">&times;</button>
            </div>
            <form class="admin-form admin-grid-form" id="profile-edit-form">
                <input type="hidden" name="person_id">
                <p class="text-secondary profile-edit-note" data-i18n="edit_person_note">ಬದಲಾವಣೆಗಳು ಆಡ್ಮಿನ್ ಪರಿಶೀಲನೆಗೆ ಸಲ್ಲಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ತಕ್ಷಣ ವಂಶವೃಕ್ಷದಲ್ಲಿ ಕಾಣಿಸದು.</p>
                <label>
                    <span data-i18n="name_kn_label">ಕನ್ನಡ ಹೆಸರು</span>
                    <input type="text" name="name_kn">
                </label>
                <label>
                    <span data-i18n="name_en_label">ಇಂಗ್ಲಿಷ್ ಹೆಸರು</span>
                    <input type="text" name="name_en">
                </label>
                <label>
                    <span data-i18n="gender">ಲಿಂಗ</span>
                    <select name="gender">
                        <option value="" data-i18n="not_specified">ನಿರ್ದಿಷ್ಟಪಡಿಸಲಾಗಿಲ್ಲ</option>
                        <option value="MALE" data-i18n="male">ಪುರುಷ</option>
                        <option value="FEMALE" data-i18n="female">ಮಹಿಳೆ</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="dob_label">ಜನ್ಮ ದಿನಾಂಕ</span>
                    <input type="date" name="date_of_birth">
                </label>
                <div class="admin-form-footer profile-edit-footer">
                    <button type="button" class="admin-secondary-button" id="profile-edit-cancel" data-i18n="cancel">ರದ್ದುಮಾಡಿ</button>
                    <button type="submit" class="admin-primary-button" data-i18n="submit_for_review">ಪರಿಶೀಲನೆಗೆ ಸಲ್ಲಿಸಿ</button>
                </div>
                <p class="profile-edit-status" id="profile-edit-status"></p>
            </form>
        </div>
    </div>
</div>

<script>
    let currentLineage = null;
    const profileEditModal = document.getElementById('profile-edit-modal');
    const profileEditForm = document.getElementById('profile-edit-form');
    const profileEditStatus = document.getElementById('profile-edit-status');

    function setProfileEditStatus(message = '', isError = false) {
        profileEditStatus.textContent = message;
        profileEditStatus.classList.toggle('is-error', isError);
    }

    function setProfileEditModalOpen(isOpen) {
        profileEditModal.classList.toggle('is-open', isOpen);
        profileEditModal.setAttribute('aria-hidden', String(!isOpen));
        document.body.classList.toggle('modal-open', isOpen);
        if (!isOpen) {
            setProfileEditStatus('');
        }
    }

    function openProfileEditForm(person) {
        if (!person) return;
        profileEditForm.elements.person_id.value = person.id;
        profileEditForm.elements.name_kn.value = person.name_kn || '';
        profileEditForm.elements.name_en.value = person.name_en || '';
        profileEditForm.elements.gender.value = person.gender || '';
        profileEditForm.elements.date_of_birth.value = person.date_of_birth || '';
        setProfileEditStatus('');
        setProfileEditModalOpen(true);
        window.setTimeout(() => profileEditForm.elements.name_kn.focus(), 60);
    }

    async function fetchLineage() {
        const id = document.getElementById('person-select').value;
        if (!id) return;

        const container = document.getElementById('result');
        container.innerHTML = '';
        currentLineage = null;
        showProfileLoader(container);
        setProfileLoading(true);

        try {
            const res = await fetch(`/api/profile/${id}`);
            const data = await res.json();

            container.innerHTML = '';
        
            if (data.error) {
                const error = document.createElement('p');
                error.style.color = '#ef4444';
                error.textContent = relationshipForLanguage(data) || t('person_not_found');
                container.appendChild(error);
                return;
            }

            currentLineage = data;
            renderLineage();
        } finally {
            setProfileLoading(false);
        }
    }

    function setProfileLoading(isLoading) {
        const button = document.getElementById('profile-submit');
        const select = document.getElementById('person-select');
        if (button) button.disabled = isLoading;
        if (select) {
            select.disabled = isLoading;
            setSearchableSelectDisabled(select, isLoading);
        }
    }

    function showProfileLoader(container) {
        container.appendChild(createLoadingPanel('profile', t('loading_profile')));
    }

    function renderLineage() {
        const container = document.getElementById('result');
        container.innerHTML = '';

        if (!currentLineage) {
            return;
        }

        const profile = currentLineage.profile;
        if (profile) {
            container.appendChild(renderProfileSummary(profile));
        }

        const lineagePanel = document.createElement('div');
        lineagePanel.className = 'profile-panel';

        const lineageTitle = document.createElement('h3');
        lineageTitle.textContent = t('lineage');
        lineagePanel.appendChild(lineageTitle);

        if (currentLineage.path?.length) {
            const parentSection = document.createElement('div');
            parentSection.className = 'lineage-section';

            currentLineage.path.forEach((node, index) => {
                parentSection.appendChild(renderLineageNode(node));
                if (index < currentLineage.path.length - 1) {
                    parentSection.appendChild(renderConnector());
                }
            });

            lineagePanel.appendChild(parentSection);
        }

        if (currentLineage.tree?.children?.length) {
            const childrenSection = document.createElement('div');
            childrenSection.className = 'descendant-section';
            childrenSection.appendChild(renderConnector());
            childrenSection.appendChild(renderChildren(currentLineage.tree.children));
            lineagePanel.appendChild(childrenSection);
        }

        container.appendChild(lineagePanel);
    }

    function renderConnector() {
        const connector = document.createElement('div');
        connector.className = 'lineage-connector';
        return connector;
    }
    
    function renderLineageNode(node) {
        const personDiv = document.createElement('div');
        personDiv.className = node.selected ? 'person-node selected-person-node' : 'person-node';
        personDiv.textContent = nameForLanguage(node);
        if (node.gender) {
            personDiv.textContent += ` (${genderForLanguage(node.gender)})`;
        }
        return personDiv;
    }

    function renderProfileSummary(profile) {
        const wrapper = document.createElement('div');
        wrapper.className = 'profile-grid';

        const detailsPanel = document.createElement('div');
        detailsPanel.className = 'profile-panel profile-main';

        const personName = document.createElement('h3');
        personName.textContent = nameForLanguage(profile.person);
        detailsPanel.appendChild(personName);

        const editButton = document.createElement('button');
        editButton.type = 'button';
        editButton.className = 'admin-secondary-button profile-edit-button';
        editButton.textContent = t('edit_person');
        editButton.addEventListener('click', () => openProfileEditForm(profile.person));
        detailsPanel.appendChild(editButton);

        const nameDetails = getLanguage() === 'en'
            ? [
                [t('english_name'), profile.person.name_en || '-'],
                [t('kannada_name'), profile.person.name_kn || '-']
            ]
            : [[t('kannada_name'), profile.person.name_kn || '-']];

        detailsPanel.appendChild(renderDetailList([
            ...nameDetails,
            [t('gender'), genderForLanguage(profile.person.gender)],
            [t('parent'), profile.parent ? nameForLanguage(profile.parent) : t('not_recorded')],
            [t('generation'), t('generation_of_total', { generation: profile.generation, total: profile.total_family_generations })],
            [t('lineage_depth'), t('people_including_selected', { count: profile.lineage_depth })],
            [t('descendant_generations'), String(profile.descendant_generations)]
        ]));

        wrapper.appendChild(detailsPanel);

        const statsPanel = document.createElement('div');
        statsPanel.className = 'profile-panel';
        const statsTitle = document.createElement('h3');
        statsTitle.textContent = t('family_stats');
        statsPanel.appendChild(statsTitle);
        statsPanel.appendChild(renderStats([
            [t('direct_children'), profile.direct_children_count],
            [t('total_descendants'), profile.descendant_count],
            [t('direct_siblings'), profile.sibling_count],
            [t('brothers'), profile.brother_count],
            [t('sisters'), profile.sister_count],
            [t('unspecified_siblings'), profile.unknown_gender_sibling_count],
            [t('known_relations'), profile.known_relation_count],
            [t('ancestors'), profile.ancestor_count]
        ]));
        wrapper.appendChild(statsPanel);

        wrapper.appendChild(renderPeoplePanel(t('siblings'), profile.siblings));
        wrapper.appendChild(renderPeoplePanel(t('children'), profile.children));
        wrapper.appendChild(renderRelationPanel(profile.relation_summary));

        return wrapper;
    }

    function renderDetailList(items) {
        const list = document.createElement('dl');
        list.className = 'profile-details';

        items.forEach(([label, value]) => {
            const term = document.createElement('dt');
            term.textContent = label;
            const detail = document.createElement('dd');
            detail.textContent = value;
            list.append(term, detail);
        });

        return list;
    }

    function renderStats(items) {
        const grid = document.createElement('div');
        grid.className = 'stat-grid';

        items.forEach(([label, value]) => {
            const stat = document.createElement('div');
            stat.className = 'stat-card';
            const number = document.createElement('strong');
            number.textContent = value;
            const caption = document.createElement('span');
            caption.textContent = label;
            stat.append(number, caption);
            grid.appendChild(stat);
        });

        return grid;
    }

    function renderPeoplePanel(title, people) {
        const panel = document.createElement('div');
        panel.className = 'profile-panel';
        const heading = document.createElement('h3');
        heading.textContent = title;
        panel.appendChild(heading);

        if (!people?.length) {
            const empty = document.createElement('p');
            empty.className = 'text-secondary';
            empty.textContent = t('none_recorded');
            panel.appendChild(empty);
            return panel;
        }

        const list = document.createElement('div');
        list.className = 'profile-chip-list';
        people.forEach((person) => {
            const chip = document.createElement('span');
            chip.className = 'profile-chip';
            chip.textContent = nameForLanguage(person);
            list.appendChild(chip);
        });
        panel.appendChild(list);
        return panel;
    }

    function renderRelationPanel(summary) {
        const panel = document.createElement('div');
        panel.className = 'profile-panel';
        const heading = document.createElement('h3');
        heading.textContent = t('relation_breakdown');
        panel.appendChild(heading);

        if (!summary?.length) {
            const empty = document.createElement('p');
            empty.className = 'text-secondary';
            empty.textContent = t('no_other_relations');
            panel.appendChild(empty);
            return panel;
        }

        const simpleSummary = normalizeRelationSummary(summary);
        const list = document.createElement('div');
        list.className = 'simple-relation-list';
        simpleSummary.forEach((item) => {
            const row = document.createElement('p');
            row.className = 'simple-relation-item';
            row.textContent = getLanguage() === 'en'
                ? simpleRelationLabel(item.category, item.count, 'en')
                : simpleRelationLabel(item.category, item.count, 'kn');
            list.appendChild(row);
        });
        panel.appendChild(list);
        return panel;
    }

    function normalizeRelationSummary(summary) {
        const counts = {};
        summary.forEach((item) => {
            const category = item.category || simpleRelationCategory(item.relationship || item.label || item.label_kn || '');
            counts[category] = (counts[category] || 0) + Number(item.count || 0);
        });

        return Object.entries(counts)
            .map(([category, count]) => ({ category, count }))
            .sort((first, second) => second.count - first.count || relationCategoryOrder(first.category) - relationCategoryOrder(second.category));
    }

    function simpleRelationCategory(value) {
        const relationship = String(value).toLowerCase();
        if (relationship.includes('cousin') || relationship.includes('ಸೋದರ ಸಂಬಂಧಿ')) return 'cousins';
        if (relationship.includes('aunt') || relationship.includes('uncle') || relationship.includes('ಅತ್ತೆ') || relationship.includes('ಮಾಮ')) return 'aunts_uncles';
        if (relationship.includes('niece') || relationship.includes('nephew') || relationship.includes('ಸೋದರ ಮಗು')) return 'nieces_nephews';
        if (relationship.includes('grandparent') || relationship.includes('grandfather') || relationship.includes('grandmother') || relationship.includes('ಅಜ್ಜ') || relationship.includes('ಅಜ್ಜಿ') || relationship.includes('ಪೂರ್ವಜ')) return 'grandparents';
        if (relationship.includes('grandchild') || relationship.includes('grandson') || relationship.includes('granddaughter') || relationship.includes('ಮೊಮ್ಮ')) return 'grandchildren';
        if (['parent', 'father', 'mother'].includes(relationship) || relationship.includes('ಪೋಷ')) return 'parents';
        if (['child', 'son', 'daughter'].includes(relationship) || relationship.includes('ಮಗು') || relationship.includes('ಮಕ್ಕ')) return 'children';
        if (['sibling', 'brother', 'sister'].includes(relationship) || relationship.includes('ಸಹೋದರ')) return 'siblings';
        return 'relatives';
    }

    function relationCategoryOrder(category) {
        return {
            cousins: 1,
            siblings: 2,
            parents: 3,
            grandparents: 4,
            children: 5,
            grandchildren: 6,
            aunts_uncles: 7,
            nieces_nephews: 8,
            relatives: 9
        }[category] || 99;
    }

    function simpleRelationLabel(category, count, language) {
        if (language === 'kn') {
            const labels = {
                cousins: ['ಸೋದರ ಸಂಬಂಧಿ', 'ಸೋದರ ಸಂಬಂಧಿಗಳು'],
                siblings: ['ಸಹೋದರ/ಸಹೋದರಿ', 'ಸಹೋದರರು/ಸಹೋದರಿಯರು'],
                parents: ['ಪೋಷಕ', 'ಪೋಷಕರು'],
                grandparents: ['ಅಜ್ಜ/ಅಜ್ಜಿ', 'ಅಜ್ಜ/ಅಜ್ಜಿಯರು'],
                children: ['ಮಗು', 'ಮಕ್ಕಳು'],
                grandchildren: ['ಮೊಮ್ಮಗು', 'ಮೊಮ್ಮಕ್ಕಳು'],
                aunts_uncles: ['ಅತ್ತೆ/ಮಾಮ', 'ಅತ್ತೆ/ಮಾಮಂದಿರು'],
                nieces_nephews: ['ಸೋದರ ಮಗು', 'ಸೋದರ ಮಕ್ಕಳು'],
                relatives: ['ಸಂಬಂಧಿ', 'ಸಂಬಂಧಿಕರು']
            };
            const [singular, plural] = labels[category] || labels.relatives;
            return `ಇವರಿಗೆ ${count} ${count === 1 ? singular : plural} ಇದ್ದಾರೆ`;
        }

        const labels = {
            cousins: ['cousin', 'cousins'],
            siblings: ['sibling', 'siblings'],
            parents: ['parent', 'parents'],
            grandparents: ['grandparent', 'grandparents'],
            children: ['child', 'children'],
            grandchildren: ['grandchild', 'grandchildren'],
            aunts_uncles: ['aunt/uncle', 'aunts/uncles'],
            nieces_nephews: ['niece/nephew', 'nieces/nephews'],
            relatives: ['relative', 'relatives']
        };
        const [singular, plural] = labels[category] || labels.relatives;
        return `Has ${count} ${count === 1 ? singular : plural}`;
    }

    function renderChildren(children) {
        const group = document.createElement('div');
        group.className = 'children-group';

        children.forEach((child) => {
            const branch = document.createElement('div');
            branch.className = 'child-branch';
            branch.appendChild(renderLineageNode(child));

            if (child.children?.length) {
                branch.appendChild(renderChildren(child.children));
            }

            group.appendChild(branch);
        });

        return group;
    }

    profileEditForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        setProfileEditStatus('');
        const submitButton = profileEditForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
            const response = await fetch('/api/changes/edit-person', {
                method: 'POST',
                body: new FormData(profileEditForm)
            });
            const payload = await response.json();
            if (!response.ok) {
                setProfileEditStatus(payload.error_key ? t(payload.error_key) : (payload.error || t('request_failed')), true);
                return;
            }
            setProfileEditStatus(t('review_submit_success'));
        } catch (error) {
            setProfileEditStatus(t('request_failed'), true);
        } finally {
            submitButton.disabled = false;
        }
    });

    document.getElementById('profile-edit-close').addEventListener('click', () => setProfileEditModalOpen(false));
    document.getElementById('profile-edit-cancel').addEventListener('click', () => setProfileEditModalOpen(false));
    profileEditModal.addEventListener('click', (event) => {
        if (event.target === profileEditModal) {
            setProfileEditModalOpen(false);
        }
    });
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && profileEditModal.classList.contains('is-open')) {
            setProfileEditModalOpen(false);
        }
    });

    window.addEventListener('languagechange', renderLineage);
</script>
{% endblock %}
