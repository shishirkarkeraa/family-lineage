{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Lineage Finder</h2>
    <p class="mb-4 text-secondary">Select a person to view their descendants.</p>
    
    <div class="flex gap-4 items-center">
        <select id="person-select">
            <option value="">-- Select Person --</option>
            {% for p in persons %}
                <option value="{{ p.id }}" data-name-en="{{ p.name_en }}" data-name-kn="{{ p.name_kn }}">{{ p.name_kn }}</option>
            {% endfor %}
        </select>
        <button onclick="fetchLineage()">Find Lineage</button>
    </div>
    
    <div id="result" class="lineage-container"></div>
</div>

<script>
    let currentLineage = null;

    async function fetchLineage() {
        const id = document.getElementById('person-select').value;
        if (!id) return;
        
        const res = await fetch(`/api/lineage/${id}`);
        const data = await res.json();
        
        const container = document.getElementById('result');
        container.innerHTML = '';
        
        if (data.error) {
            container.innerHTML = `<p style="color: #ef4444">${data.error}</p>`;
            return;
        }

        currentLineage = data;
        renderLineage();
    }

    function renderLineage() {
        const container = document.getElementById('result');
        container.innerHTML = '';
        if (currentLineage) {
            container.appendChild(renderNode(currentLineage));
        }
    }
    
    function renderNode(node) {
        const div = document.createElement('div');
        
        const personDiv = document.createElement('div');
        personDiv.className = 'person-node';
        personDiv.textContent = nameForLanguage(node);
        if (node.gender) {
            personDiv.textContent += ` (${node.gender})`;
        }
        div.appendChild(personDiv);
        
        if (node.children && node.children.length > 0) {
            const childrenGroup = document.createElement('div');
            childrenGroup.className = 'children-group';
            node.children.forEach(child => {
                childrenGroup.appendChild(renderNode(child));
            });
            div.appendChild(childrenGroup);
        }
        
        return div;
    }

    window.addEventListener('languagechange', renderLineage);
</script>
{% endblock %}
