{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Lineage Finder</h2>
    <p class="mb-4 text-secondary">Select a person to view their lineage.</p>
    
    <div class="flex gap-4 items-center">
        <select id="person-select">
            <option value="">-- Select Person --</option>
            {% for p in persons %}
                <option value="{{ p.id }}" data-name-en="{{ p.name_en }}" data-name-kn="{{ p.name_kn }}">{{ p.name_kn }}</option>
            {% endfor %}
        </select>
        <button onclick="fetchLineage()">Find Lineage</button>
    </div>
    
    <div id="result" class="lineage-container"></div>
</div>

<script>
    let currentLineage = null;

    async function fetchLineage() {
        const id = document.getElementById('person-select').value;
        if (!id) return;
        
        const res = await fetch(`/api/lineage/${id}`);
        const data = await res.json();
        
        const container = document.getElementById('result');
        container.innerHTML = '';
        
        if (data.error) {
            container.innerHTML = `<p style="color: #ef4444">${data.error}</p>`;
            return;
        }

        currentLineage = data;
        renderLineage();
    }

    function renderLineage() {
        const container = document.getElementById('result');
        container.innerHTML = '';

        if (!currentLineage) {
            return;
        }

        if (currentLineage.path?.length) {
            const parentSection = document.createElement('div');
            parentSection.className = 'lineage-section';

            currentLineage.path.forEach((node, index) => {
                parentSection.appendChild(renderLineageNode(node));
                if (index < currentLineage.path.length - 1) {
                    parentSection.appendChild(renderConnector());
                }
            });

            container.appendChild(parentSection);
        }

        if (currentLineage.tree?.children?.length) {
            const childrenSection = document.createElement('div');
            childrenSection.className = 'descendant-section';
            childrenSection.appendChild(renderConnector());
            childrenSection.appendChild(renderChildren(currentLineage.tree.children));
            container.appendChild(childrenSection);
        }
    }

    function renderConnector() {
        const connector = document.createElement('div');
        connector.className = 'lineage-connector';
        return connector;
    }
    
    function renderLineageNode(node) {
        const personDiv = document.createElement('div');
        personDiv.className = node.selected ? 'person-node selected-person-node' : 'person-node';
        personDiv.textContent = nameForLanguage(node);
        if (node.gender) {
            personDiv.textContent += ` (${node.gender})`;
        }
        return personDiv;
    }

    function renderChildren(children) {
        const group = document.createElement('div');
        group.className = 'children-group';

        children.forEach((child) => {
            const branch = document.createElement('div');
            branch.className = 'child-branch';
            branch.appendChild(renderLineageNode(child));

            if (child.children?.length) {
                branch.appendChild(renderChildren(child.children));
            }

            group.appendChild(branch);
        });

        return group;
    }

    window.addEventListener('languagechange', renderLineage);
</script>
{% endblock %}
