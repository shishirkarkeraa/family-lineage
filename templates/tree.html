{% extends "base.html" %}

{% block head %}
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
    #mynetwork {
        width: 100%;
        height: min(700px, calc(100vh - 170px));
        min-height: 420px;
        border: 1px solid var(--border-color);
        background-color: #101010;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
            linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
        border-radius: 8px;
        touch-action: none;
    }

    .tree-viewer {
        position: relative;
    }

    .tree-zoom-controls {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .tree-layout-select {
        height: 40px;
        max-width: 190px;
        border: 1px solid rgba(248, 250, 252, 0.6);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.88);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        padding: 0 32px 0 12px;
        cursor: pointer;
    }

    .tree-zoom-button {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(248, 250, 252, 0.6);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.88);
        color: #ffffff;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .tree-zoom-button:hover,
    .tree-zoom-button:focus-visible,
    .tree-layout-select:hover,
    .tree-layout-select:focus-visible {
        background: rgba(32, 32, 32, 0.96);
        border-color: #ffffff;
    }

    .tree-layout-select:focus-visible,
    .tree-zoom-button:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
    }

    @media (max-width: 720px) {
        #mynetwork {
            height: calc(100vh - 150px);
            min-height: 360px;
        }

        .tree-zoom-controls {
            left: 12px;
            right: 12px;
            justify-content: flex-end;
        }

        .tree-layout-select {
            flex: 1;
            min-width: 0;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h2 data-i18n="complete_family">ಸಂಪೂರ್ಣ ಕರ್ಕೇರ ಕುಟುಂಬ</h2>
    <div class="tree-viewer">
        <div class="tree-zoom-controls" aria-label="Tree zoom controls">
            <select class="tree-layout-select" id="tree-layout-direction" aria-label="Tree layout direction">
                <option value="UD">Top to bottom</option>
                <option value="LR">Left to right</option>
                <option value="RL">Right to left</option>
                <option value="DU">Bottom to top</option>
            </select>
            <button type="button" class="tree-zoom-button" id="tree-zoom-out" aria-label="Zoom out">&minus;</button>
            <button type="button" class="tree-zoom-button" id="tree-zoom-in" aria-label="Zoom in">+</button>
        </div>
        <div id="mynetwork"></div>
    </div>
</div>

<script type="text/javascript">
    const nodesData = {{ nodes | tojson | safe }};
    const edgesData = {{ edges | tojson | safe }};
    let treeDirection = 'UD';
    
    function isCompactTree() {
        return window.matchMedia('(max-width: 720px)').matches;
    }

    function buildVisNodes() {
        const compact = isCompactTree();
        return nodesData.map(node => ({
            id: node.id,
            label: nameForLanguage(node),
            level: node.level,
            shape: 'box',
            color: {
                background: '#111111',
                border: '#f8fafc',
                highlight: {
                    background: '#181818',
                    border: '#ffffff'
                },
                hover: {
                    background: '#181818',
                    border: '#ffffff'
                }
            },
            font: {
                color: '#ffffff',
                face: 'Inter',
                size: compact ? 13 : 16
            },
            borderWidth: 2,
            borderWidthSelected: 2,
            margin: {
                top: compact ? 12 : 18,
                right: compact ? 16 : 28,
                bottom: compact ? 12 : 18,
                left: compact ? 16 : 28
            },
            widthConstraint: {
                minimum: compact ? 128 : 180,
                maximum: compact ? 180 : 260
            }
        }));
    }

    const visNodes = new vis.DataSet(buildVisNodes());

    const visEdges = new vis.DataSet(
        edgesData.map(edge => ({
            from: edge.from,
            to: edge.to,
            arrows: 'to',
            color: {
                color: '#f8fafc',
                highlight: '#ffffff',
                hover: '#ffffff'
            },
            smooth: {
                enabled: true,
                type: 'discrete',
                roundness: 0
            }
        }))
    );

    const container = document.getElementById('mynetwork');
    const data = {
        nodes: visNodes,
        edges: visEdges
    };
    function treeOptions() {
        const compact = isCompactTree();
        const isSideways = treeDirection === 'LR' || treeDirection === 'RL';
        return {
        layout: {
            hierarchical: {
                direction: treeDirection,
                sortMethod: 'directed',
                levelSeparation: isSideways ? (compact ? 190 : 260) : (compact ? 130 : 190),
                nodeSpacing: isSideways ? (compact ? 120 : 170) : (compact ? 150 : 220),
                treeSpacing: compact ? 180 : 260
            }
        },
        edges: {
            chosen: false,
            width: 2,
            arrows: {
                to: {
                    enabled: true,
                    scaleFactor: 0.8,
                    type: 'arrow'
                }
            },
            smooth: {
                enabled: true,
                type: 'discrete',
                roundness: 0
            }
        },
        interaction: {
            hover: true,
            dragNodes: false,
            dragView: true,
            zoomView: false
        },
        physics: false
    };
    }
    
    const network = new vis.Network(container, data, treeOptions());
    const minTreeScale = 0.18;
    const maxTreeScale = 2.4;
    let lastPinchDistance = null;

    function clampTreeScale(scale) {
        return Math.max(minTreeScale, Math.min(maxTreeScale, scale));
    }

    function touchDistance(touches) {
        const firstTouch = touches[0];
        const secondTouch = touches[1];
        return Math.hypot(
            firstTouch.clientX - secondTouch.clientX,
            firstTouch.clientY - secondTouch.clientY
        );
    }

    function zoomTree(multiplier) {
        const scale = clampTreeScale(network.getScale() * multiplier);
        network.moveTo({
            position: network.getViewPosition(),
            scale,
            animation: {
                duration: 180,
                easingFunction: 'easeInOutQuad'
            }
        });
    }

    document.getElementById('tree-zoom-in').addEventListener('click', () => zoomTree(1.2));
    document.getElementById('tree-zoom-out').addEventListener('click', () => zoomTree(1 / 1.2));
    document.getElementById('tree-layout-direction').addEventListener('change', event => {
        treeDirection = event.target.value;
        network.setOptions(treeOptions());
        network.fit({
            animation: {
                duration: 240,
                easingFunction: 'easeInOutQuad'
            }
        });
    });

    container.addEventListener('wheel', event => {
        if (event.ctrlKey || event.metaKey) {
            event.preventDefault();
        }
    }, { passive: false });

    container.addEventListener('touchmove', event => {
        if (event.touches.length > 1) {
            event.preventDefault();
            const pinchDistance = touchDistance(event.touches);
            if (lastPinchDistance) {
                const nextScale = clampTreeScale(network.getScale() * (pinchDistance / lastPinchDistance));
                network.moveTo({
                    position: network.getViewPosition(),
                    scale: nextScale,
                    animation: false
                });
            }
            lastPinchDistance = pinchDistance;
        }
    }, { passive: false });

    container.addEventListener('touchend', event => {
        if (event.touches.length < 2) {
            lastPinchDistance = null;
        }
    });

    container.addEventListener('touchcancel', () => {
        lastPinchDistance = null;
    });

    ['gesturestart', 'gesturechange', 'gestureend'].forEach(eventName => {
        container.addEventListener(eventName, event => event.preventDefault());
    });

    window.addEventListener('languagechange', () => {
        visNodes.update(buildVisNodes());
        network.fit();
    });

    window.addEventListener('resize', () => {
        visNodes.update(buildVisNodes());
        network.setOptions(treeOptions());
        network.fit();
    });
</script>
{% endblock %}
