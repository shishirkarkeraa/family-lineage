{% extends "base.html" %}

{% block head %}
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
    #mynetwork {
        width: 100%;
        height: min(700px, calc(100vh - 170px));
        min-height: 420px;
        border: 1px solid var(--border-color);
        background-color: #101010;
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
            linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 80px 80px, 80px 80px, 20px 20px, 20px 20px;
        border-radius: 8px;
        touch-action: none;
    }

    .tree-viewer {
        position: relative;
    }

    .tree-zoom-controls {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .tree-layout-select {
        height: 40px;
        max-width: 190px;
        border: 1px solid rgba(248, 250, 252, 0.6);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.88);
        color: #ffffff;
        font: inherit;
        font-size: 14px;
        padding: 0 32px 0 12px;
        cursor: pointer;
    }

    .tree-zoom-button {
        width: 40px;
        height: 40px;
        border: 1px solid rgba(248, 250, 252, 0.6);
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.88);
        color: #ffffff;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .tree-zoom-button:hover,
    .tree-zoom-button:focus-visible,
    .tree-layout-select:hover,
    .tree-layout-select:focus-visible {
        background: rgba(32, 32, 32, 0.96);
        border-color: #ffffff;
    }

    .tree-layout-select:focus-visible,
    .tree-zoom-button:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
    }

    .tree-action-panel {
        background: rgba(8, 8, 8, 0.96);
        border: 1px solid rgba(248, 250, 252, 0.32);
        border-radius: 8px;
        box-shadow: 0 20px 52px rgba(0, 0, 0, 0.55);
        display: none;
        max-height: calc(100% - 88px);
        overflow: auto;
        padding: 1rem;
        position: absolute;
        right: 12px;
        top: 64px;
        width: min(360px, calc(100% - 24px));
        z-index: 3;
    }

    .tree-action-panel.is-open {
        display: grid;
        gap: 0.85rem;
    }

    .tree-action-header {
        align-items: start;
        display: flex;
        gap: 0.75rem;
        justify-content: space-between;
    }

    .tree-action-header h3 {
        font-size: 1rem;
        margin: 0;
    }

    .tree-action-kicker,
    .tree-action-note,
    .tree-action-status {
        color: var(--text-secondary);
        font-size: 0.85rem;
        margin: 0;
    }

    .tree-action-buttons,
    .tree-action-footer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: flex-end;
    }

    .tree-action-buttons .tree-zoom-button,
    .tree-action-footer .tree-zoom-button {
        font-size: 0.88rem;
        height: auto;
        min-height: 40px;
        padding: 0.6rem 0.75rem;
        width: auto;
    }

    .tree-action-form {
        display: none;
        gap: 0.75rem;
    }

    .tree-action-form.is-open {
        display: grid;
    }

    .tree-action-form label {
        color: var(--text-secondary);
        display: grid;
        font-size: 0.85rem;
        font-weight: 700;
        gap: 0.35rem;
    }

    .tree-action-form input,
    .tree-action-form select {
        min-height: 40px;
        padding: 0.6rem 0.7rem;
    }

    .tree-action-status.is-error {
        color: #fecaca;
    }

    .tree-panel-close {
        min-height: 34px;
        min-width: 34px;
        padding: 0;
    }

    @media (max-width: 720px) {
        #mynetwork {
            height: calc(100vh - 150px);
            min-height: 360px;
        }

        .tree-zoom-controls {
            left: 12px;
            right: 12px;
            justify-content: flex-end;
        }

        .tree-layout-select {
            flex: 1;
            min-width: 0;
        }

        .tree-action-panel {
            bottom: 12px;
            max-height: min(440px, calc(100% - 88px));
            top: auto;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="card">
    <h2 data-i18n="complete_family">ಸಂಪೂರ್ಣ ಕರ್ಕೇರ ಕುಟುಂಬ</h2>
    <div class="tree-viewer">
        <div class="tree-zoom-controls" aria-label="Tree zoom controls">
            <select class="tree-layout-select" id="tree-layout-direction" aria-label="Tree layout direction">
                <option value="UD">Top to bottom</option>
                <option value="LR">Left to right</option>
                <option value="RL">Right to left</option>
                <option value="DU">Bottom to top</option>
            </select>
            <button type="button" class="tree-zoom-button" id="tree-zoom-out" aria-label="Zoom out">&minus;</button>
            <button type="button" class="tree-zoom-button" id="tree-zoom-in" aria-label="Zoom in">+</button>
        </div>
        <div id="mynetwork"></div>
        <aside class="tree-action-panel" id="tree-action-panel" aria-live="polite">
            <div class="tree-action-header">
                <div>
                    <p class="tree-action-kicker" data-i18n="tree_actions">ವಂಶವೃಕ್ಷ ಕ್ರಿಯೆಗಳು</p>
                    <h3 id="tree-action-person" data-i18n="choose_person_prompt">ನವೀಕರಣವನ್ನು ವಿನಂತಿಸಲು ವಂಶವೃಕ್ಷದಲ್ಲಿ ಒಬ್ಬರನ್ನು ಆಯ್ಕೆಮಾಡಿ.</h3>
                </div>
                <button type="button" class="tree-zoom-button tree-panel-close" id="tree-action-close" data-i18n-aria-label="close_menu" aria-label="ಮೆನು ಮುಚ್ಚಿರಿ">&times;</button>
            </div>
            <div class="tree-action-buttons" id="tree-action-buttons">
                <button type="button" class="tree-zoom-button" id="tree-add-descendant" data-i18n="add_descendant">ವಂಶಜರನ್ನು ಸೇರಿಸಿ</button>
                <button type="button" class="tree-zoom-button" id="tree-edit-person" data-i18n="edit_person">ವ್ಯಕ್ತಿಯನ್ನು ತಿದ್ದುಪಡಿ ಮಾಡಿ</button>
            </div>
            <form class="tree-action-form" id="tree-add-form">
                <input type="hidden" name="parent_id">
                <p class="tree-action-note" id="tree-add-note"></p>
                <label>
                    <span data-i18n="name_kn_label">ಕನ್ನಡ ಹೆಸರು</span>
                    <input type="text" name="name_kn">
                </label>
                <label>
                    <span data-i18n="name_en_label">ಇಂಗ್ಲಿಷ್ ಹೆಸರು</span>
                    <input type="text" name="name_en">
                </label>
                <label>
                    <span data-i18n="gender">ಲಿಂಗ</span>
                    <select name="gender">
                        <option value="" data-i18n="not_specified">ನಿರ್ದಿಷ್ಟಪಡಿಸಲಾಗಿಲ್ಲ</option>
                        <option value="MALE" data-i18n="male">ಪುರುಷ</option>
                        <option value="FEMALE" data-i18n="female">ಮಹಿಳೆ</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="dob_label">ಜನ್ಮ ದಿನಾಂಕ</span>
                    <input type="date" name="date_of_birth">
                </label>
                <div class="tree-action-footer">
                    <button type="button" class="tree-zoom-button tree-form-cancel" data-i18n="cancel">ರದ್ದುಮಾಡಿ</button>
                    <button type="submit" class="tree-zoom-button" data-i18n="submit_for_review">ಪರಿಶೀಲನೆಗೆ ಸಲ್ಲಿಸಿ</button>
                </div>
            </form>
            <form class="tree-action-form" id="tree-edit-form">
                <input type="hidden" name="person_id">
                <p class="tree-action-note" data-i18n="edit_person_note">ಬದಲಾವಣೆಗಳು ಆಡ್ಮಿನ್ ಪರಿಶೀಲನೆಗೆ ಸಲ್ಲಿಸಲಾಗುತ್ತದೆ ಮತ್ತು ತಕ್ಷಣ ವಂಶವೃಕ್ಷದಲ್ಲಿ ಕಾಣಿಸದು.</p>
                <label>
                    <span data-i18n="name_kn_label">ಕನ್ನಡ ಹೆಸರು</span>
                    <input type="text" name="name_kn">
                </label>
                <label>
                    <span data-i18n="name_en_label">ಇಂಗ್ಲಿಷ್ ಹೆಸರು</span>
                    <input type="text" name="name_en">
                </label>
                <label>
                    <span data-i18n="gender">ಲಿಂಗ</span>
                    <select name="gender">
                        <option value="" data-i18n="not_specified">ನಿರ್ದಿಷ್ಟಪಡಿಸಲಾಗಿಲ್ಲ</option>
                        <option value="MALE" data-i18n="male">ಪುರುಷ</option>
                        <option value="FEMALE" data-i18n="female">ಮಹಿಳೆ</option>
                    </select>
                </label>
                <label>
                    <span data-i18n="dob_label">ಜನ್ಮ ದಿನಾಂಕ</span>
                    <input type="date" name="date_of_birth">
                </label>
                <div class="tree-action-footer">
                    <button type="button" class="tree-zoom-button tree-form-cancel" data-i18n="cancel">ರದ್ದುಮಾಡಿ</button>
                    <button type="submit" class="tree-zoom-button" data-i18n="submit_for_review">ಪರಿಶೀಲನೆಗೆ ಸಲ್ಲಿಸಿ</button>
                </div>
            </form>
            <p class="tree-action-status" id="tree-action-status"></p>
        </aside>
    </div>
</div>

<script type="text/javascript">
    const nodesData = {{ nodes | tojson | safe }};
    const edgesData = {{ edges | tojson | safe }};
    let treeDirection = 'UD';
    
    function isCompactTree() {
        return window.matchMedia('(max-width: 720px)').matches;
    }

    function buildVisNodes() {
        const compact = isCompactTree();
        return nodesData.map(node => ({
            id: node.id,
            label: nameForLanguage(node),
            level: node.level,
            shape: 'box',
            color: {
                background: '#111111',
                border: '#f8fafc',
                highlight: {
                    background: '#181818',
                    border: '#ffffff'
                },
                hover: {
                    background: '#181818',
                    border: '#ffffff'
                }
            },
            font: {
                color: '#ffffff',
                face: 'Inter',
                size: compact ? 13 : 16
            },
            borderWidth: 2,
            borderWidthSelected: 2,
            margin: {
                top: compact ? 12 : 18,
                right: compact ? 16 : 28,
                bottom: compact ? 12 : 18,
                left: compact ? 16 : 28
            },
            widthConstraint: {
                minimum: compact ? 128 : 180,
                maximum: compact ? 180 : 260
            }
        }));
    }

    const visNodes = new vis.DataSet(buildVisNodes());

    const visEdges = new vis.DataSet(
        edgesData.map(edge => ({
            from: edge.from,
            to: edge.to,
            arrows: 'to',
            color: {
                color: '#f8fafc',
                highlight: '#ffffff',
                hover: '#ffffff'
            },
            smooth: {
                enabled: true,
                type: 'discrete',
                roundness: 0
            }
        }))
    );

    const container = document.getElementById('mynetwork');
    const data = {
        nodes: visNodes,
        edges: visEdges
    };
    function treeOptions() {
        const compact = isCompactTree();
        const isSideways = treeDirection === 'LR' || treeDirection === 'RL';
        return {
        layout: {
            hierarchical: {
                direction: treeDirection,
                sortMethod: 'directed',
                levelSeparation: isSideways ? (compact ? 190 : 260) : (compact ? 130 : 190),
                nodeSpacing: isSideways ? (compact ? 120 : 170) : (compact ? 150 : 220),
                treeSpacing: compact ? 180 : 260
            }
        },
        edges: {
            chosen: false,
            width: 2,
            arrows: {
                to: {
                    enabled: true,
                    scaleFactor: 0.8,
                    type: 'arrow'
                }
            },
            smooth: {
                enabled: true,
                type: 'discrete',
                roundness: 0
            }
        },
        interaction: {
            hover: true,
            dragNodes: false,
            dragView: true,
            zoomView: false
        },
        physics: false
    };
    }
    
    const network = new vis.Network(container, data, treeOptions());
    const minTreeScale = 0.18;
    const maxTreeScale = 2.4;
    let lastPinchDistance = null;
    let selectedTreeNode = null;
    const actionPanel = document.getElementById('tree-action-panel');
    const actionPerson = document.getElementById('tree-action-person');
    const actionButtons = document.getElementById('tree-action-buttons');
    const actionStatus = document.getElementById('tree-action-status');
    const addForm = document.getElementById('tree-add-form');
    const editForm = document.getElementById('tree-edit-form');

    function nodeById(id) {
        return nodesData.find(node => node.id === id);
    }

    function setActionStatus(message = '', isError = false) {
        actionStatus.textContent = message;
        actionStatus.classList.toggle('is-error', isError);
    }

    function closeTreeForms() {
        addForm.classList.remove('is-open');
        editForm.classList.remove('is-open');
        actionButtons.hidden = false;
    }

    function renderTreeActionText() {
        if (!selectedTreeNode) return;
        const selectedName = nameForLanguage(selectedTreeNode) || `Person #${selectedTreeNode.id}`;
        actionPerson.textContent = selectedName;
        document.getElementById('tree-add-note').textContent = t('adding_descendant_note', { parent: selectedName });
    }

    function openTreeActionPanel(node) {
        selectedTreeNode = node;
        actionPanel.classList.add('is-open');
        actionButtons.hidden = false;
        closeTreeForms();
        setActionStatus('');
        renderTreeActionText();
    }

    function showAddForm() {
        if (!selectedTreeNode) return;
        closeTreeForms();
        addForm.reset();
        addForm.elements.parent_id.value = selectedTreeNode.id;
        addForm.classList.add('is-open');
        actionButtons.hidden = true;
        setActionStatus('');
        renderTreeActionText();
        addForm.elements.name_kn.focus();
    }

    function showEditForm() {
        if (!selectedTreeNode) return;
        closeTreeForms();
        editForm.elements.person_id.value = selectedTreeNode.id;
        editForm.elements.name_kn.value = selectedTreeNode.name_kn || '';
        editForm.elements.name_en.value = selectedTreeNode.name_en || '';
        editForm.elements.gender.value = selectedTreeNode.gender || '';
        editForm.elements.date_of_birth.value = selectedTreeNode.date_of_birth || '';
        editForm.classList.add('is-open');
        actionButtons.hidden = true;
        setActionStatus('');
        editForm.elements.name_kn.focus();
    }

    async function submitTreeChange(form, url, validateNames = false) {
        setActionStatus('');
        if (validateNames && !form.elements.name_kn.value.trim() && !form.elements.name_en.value.trim()) {
            setActionStatus(t('enter_one_name'), true);
            return;
        }

        const submitButton = form.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        try {
            const response = await fetch(url, {
                method: 'POST',
                body: new FormData(form)
            });
            const payload = await response.json();
            if (!response.ok) {
                setActionStatus(payload.error_key ? t(payload.error_key) : (payload.error || t('no_changes_submitted')), true);
                return;
            }
            closeTreeForms();
            setActionStatus(t('review_submit_success'));
        } catch (error) {
            setActionStatus(t('request_failed'), true);
        } finally {
            submitButton.disabled = false;
        }
    }

    function clampTreeScale(scale) {
        return Math.max(minTreeScale, Math.min(maxTreeScale, scale));
    }

    function touchDistance(touches) {
        const firstTouch = touches[0];
        const secondTouch = touches[1];
        return Math.hypot(
            firstTouch.clientX - secondTouch.clientX,
            firstTouch.clientY - secondTouch.clientY
        );
    }

    function zoomTree(multiplier) {
        const scale = clampTreeScale(network.getScale() * multiplier);
        network.moveTo({
            position: network.getViewPosition(),
            scale,
            animation: {
                duration: 180,
                easingFunction: 'easeInOutQuad'
            }
        });
    }

    network.on('click', params => {
        if (!params.nodes.length) return;
        const node = nodeById(params.nodes[0]);
        if (node) openTreeActionPanel(node);
    });

    document.getElementById('tree-action-close').addEventListener('click', () => {
        actionPanel.classList.remove('is-open');
        selectedTreeNode = null;
        closeTreeForms();
        setActionStatus('');
    });
    document.getElementById('tree-add-descendant').addEventListener('click', showAddForm);
    document.getElementById('tree-edit-person').addEventListener('click', showEditForm);
    document.querySelectorAll('.tree-form-cancel').forEach(button => {
        button.addEventListener('click', () => {
            closeTreeForms();
            setActionStatus('');
        });
    });
    addForm.addEventListener('submit', event => {
        event.preventDefault();
        submitTreeChange(addForm, '/api/changes/add-descendant', true);
    });
    editForm.addEventListener('submit', event => {
        event.preventDefault();
        submitTreeChange(editForm, '/api/changes/edit-person');
    });

    document.getElementById('tree-zoom-in').addEventListener('click', () => zoomTree(1.2));
    document.getElementById('tree-zoom-out').addEventListener('click', () => zoomTree(1 / 1.2));
    document.getElementById('tree-layout-direction').addEventListener('change', event => {
        treeDirection = event.target.value;
        network.setOptions(treeOptions());
        network.fit({
            animation: {
                duration: 240,
                easingFunction: 'easeInOutQuad'
            }
        });
    });

    container.addEventListener('wheel', event => {
        if (event.ctrlKey || event.metaKey) {
            event.preventDefault();
        }
    }, { passive: false });

    container.addEventListener('touchmove', event => {
        if (event.touches.length > 1) {
            event.preventDefault();
            const pinchDistance = touchDistance(event.touches);
            if (lastPinchDistance) {
                const nextScale = clampTreeScale(network.getScale() * (pinchDistance / lastPinchDistance));
                network.moveTo({
                    position: network.getViewPosition(),
                    scale: nextScale,
                    animation: false
                });
            }
            lastPinchDistance = pinchDistance;
        }
    }, { passive: false });

    container.addEventListener('touchend', event => {
        if (event.touches.length < 2) {
            lastPinchDistance = null;
        }
    });

    container.addEventListener('touchcancel', () => {
        lastPinchDistance = null;
    });

    ['gesturestart', 'gesturechange', 'gestureend'].forEach(eventName => {
        container.addEventListener(eventName, event => event.preventDefault());
    });

    window.addEventListener('languagechange', () => {
        visNodes.update(buildVisNodes());
        renderTreeActionText();
        network.fit();
    });

    window.addEventListener('resize', () => {
        visNodes.update(buildVisNodes());
        network.setOptions(treeOptions());
        network.fit();
    });
</script>
{% endblock %}
